name: Build Package
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build on Node 24.x
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm install
      - run: ./scripts/build.sh
